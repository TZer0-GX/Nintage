<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Nin-tage</title>
  <!-- Inclusion de Nostalgia.nes pour l'émulation NES -->
  <link rel="stylesheet" href="https://unpkg.com/nostalgia.js/dist/nostalgia.css">
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #1a1a1a;
      color: #ffffff;
      display: flex;
      justify-content: center;
      padding: 20px;
    }

    #app-container {
      width: 820px;
      border: 2px solid #000;
      background-color: #2b2b2b;
      box-shadow: 0 0 15px rgba(0,0,0,0.8);
    }

    /* --- TOP HEADER (Jaune Newgrounds 2005) --- */
    #top-bar {
      display: flex;
      background: linear-gradient(to bottom, #ffff00 0%, #cccc00 100%);
      border-bottom: 2px solid #000;
      height: 70px;
    }

    .logo-zone {
      width: 280px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-right: 2px solid #000;
      background: linear-gradient(to bottom, #ffff00 0%, #d4d400 100%);
      cursor: pointer; /* Indique que le logo est cliquable */
      user-select: none;
    }

    .logo-badge {
      background: linear-gradient(to bottom, #e60000 0%, #990000 100%);
      border: 3px solid #000;
      border-radius: 20px;
      padding: 5px 25px;
      color: #e60000;
      font-weight: bold;
      font-size: 22px;
      text-shadow: 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
      transition: transform 0.1s ease;
    }

    .logo-zone:active .logo-badge {
      transform: scale(0.96);
    }

    .header-nav {
      display: flex;
      flex: 1;
    }

    .nav-btn {
      flex: 1;
      border-right: 2px solid #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #000;
      cursor: pointer;
      background: linear-gradient(to bottom, #d8e000 0%, #a0a800 100%);
    }

    /* Bouton de connexion révisé */
    .user-zone {
      width: 230px;
      background: linear-gradient(to bottom, #cccccc 0%, #888888 100%);
      border-left: 2px solid #000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
    }

    .login-btn {
      background: linear-gradient(to bottom, #ffffff 0%, #cccccc 100%);
      border: 2px solid #000;
      border-radius: 6px;
      padding: 8px 16px;
      color: #000;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      box-shadow: inset 0 1px 0 #fff, 0 2px 3px rgba(0,0,0,0.3);
    }

    .login-btn:hover {
      background: linear-gradient(to bottom, #ffffff 0%, #e6e6e6 100%);
    }

    .login-btn:active {
      background: #aaaaaa;
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.5);
    }

    /* --- ONGLETS --- */
    #tab-bar {
      display: flex;
      background-color: #1c1c1c;
      border-bottom: 2px solid #000;
    }

    .tab {
      padding: 10px 20px;
      color: #ccc;
      font-weight: bold;
      font-size: 13px;
      border-right: 1px solid #333;
      cursor: pointer;
      background: linear-gradient(to bottom, #3a3a3a 0%, #222222 100%);
    }

    .tab.active {
      background: linear-gradient(to bottom, #444444 0%, #1a1a1a 100%);
      color: #fff;
      border-top: 3px solid #ff9900;
      border-bottom: 1px solid #1a1a1a;
      border-radius: 8px 8px 0 0;
      margin-top: -3px;
    }

    /* --- LAYOUT PRINCIPAL --- */
    #main-content {
      display: flex;
    }

    #game-area {
      flex: 1;
      padding: 15px;
      background-color: #222222;
      border-right: 2px solid #000;
    }

    /* Titre et Tags */
    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 10px;
    }

    .game-title-block h1 {
      color: #ff9900;
      font-size: 20px;
      text-decoration: underline;
    }

    .game-title-block p {
      color: #aaa;
      font-size: 12px;
      margin-top: 2px;
    }

    .tags-container {
      display: flex;
      gap: 6px;
    }

    .tag {
      padding: 3px 10px;
      border-radius: 6px;
      border: 2px solid #000;
      font-weight: bold;
      font-size: 11px;
      color: #fff;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.4);
    }

    .tag-green { background: linear-gradient(to bottom, #00cc44 0%, #006622 100%); }
    .tag-darkgreen { background: linear-gradient(to bottom, #008833 0%, #004411 100%); }
    .tag-red { background: linear-gradient(to bottom, #cc0000 0%, #660000 100%); }

    /* Conteneur Émulateur */
    #emulator-viewport {
      width: 100%;
      height: 380px;
      background-color: #000;
      border: 2px solid #fff;
      position: relative;
    }

    /* --- BARRE INTERACTIVE DE FAVORIS & RECOMMANDATIONS --- */
    .game-footer {
      margin-top: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(to bottom, #3a3a3a 0%, #151515 100%);
      border: 1px solid #555;
      padding: 6px 12px;
      border-radius: 4px;
    }

    /* Favoris interactif */
    .fav-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #fff;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      user-select: none;
      padding: 4px 8px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid transparent;
      transition: background 0.2s, border 0.2s;
    }

    .fav-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid #777;
    }

    .fav-icon {
      color: #888;
      font-size: 16px;
      transition: color 0.2s, transform 0.2s;
    }

    .fav-btn.active .fav-icon {
      color: #ff3333;
      transform: scale(1.2);
    }

    /* Notation par étoiles interactive */
    .rating-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .stars {
      display: flex;
      gap: 2px;
      cursor: pointer;
      direction: ltr;
    }

    .star {
      font-size: 20px;
      color: #444;
      transition: color 0.15s;
      user-select: none;
    }

    .star.active, .star.hover {
      color: #ffcc00;
      text-shadow: 0 0 4px rgba(255, 204, 0, 0.6);
    }

    /* --- BARRE LATÉRALE RECOMMANDATIONS --- */
    #sidebar {
      width: 210px;
      background-color: #2b2b2b;
    }

    .sidebar-header {
      background: linear-gradient(to bottom, #444 0%, #111 100%);
      color: #fff;
      text-align: center;
      padding: 8px;
      font-size: 13px;
      font-weight: bold;
      border-bottom: 1px solid #000;
    }

    .reco-item {
      height: 45px;
      border-bottom: 2px solid #000;
      background: linear-gradient(to bottom, #666666 0%, #333333 100%);
    }

    .sidebar-footer {
      height: 30px;
      background: linear-gradient(to bottom, #444 0%, #111 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .arrow-down {
      width: 0;
      height: 0;
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-top: 10px solid #ffcc00;
    }
  </style>
</head>
<body>

  <div id="app-container">
    <!-- TOP HEADER -->
    <div id="top-bar">
      <!-- Clic sur le logo recharge la page -->
      <div class="logo-zone" onclick="window.location.reload();" title="Recharger la page">
        <div class="logo-badge">Nin-tage</div>
      </div>
      <div class="header-nav">
        <div class="nav-btn">NES</div>
        <div class="nav-btn">Game Boy</div>
      </div>
      <!-- Nouveau bouton de connexion -->
      <div class="user-zone">
        <button class="login-btn">Connectez-vous</button>
      </div>
    </div>

    <!-- TAB BAR -->
    <div id="tab-bar">
      <div class="tab">Histoire / Manuel</div>
      <div class="tab active">Jouer à ce jeu</div>
      <div class="tab">Commentaires / Forum</div>
    </div>

    <!-- MAIN CONTENT -->
    <div id="main-content">
      <div id="game-area">
        <div class="game-header">
          <div class="game-title-block">
            <h1>Super Mario Bros</h1>
            <p>1985 – Nintendo</p>
          </div>
          <div class="tags-container">
            <span class="tag tag-green">Plateformer</span>
            <span class="tag tag-darkgreen">Classique</span>
            <span class="tag tag-red">Difficile</span>
          </div>
        </div>

        <!-- ZONE ÉMULATEUR -->
        <div id="emulator-viewport"></div>

        <!-- BARRE FAVORIS / RECOMMANDATION INTERACTIVE -->
        <div class="game-footer">
          <div class="fav-btn" id="favButton">
            <span class="fav-icon" id="favIcon">♥</span>
            <span id="favText">Ajouter aux favoris</span>
          </div>
          <div class="rating-container">
            <div class="stars" id="starRating">
              <span class="star" data-value="1">★</span>
              <span class="star" data-value="2">★</span>
              <span class="star" data-value="3">★</span>
              <span class="star" data-value="4">★</span>
              <span class="star" data-value="5">★</span>
            </div>
          </div>
        </div>
      </div>

      <!-- SIDEBAR -->
      <div id="sidebar">
        <div class="sidebar-header">Recommandations</div>
        <div class="reco-item"></div>
        <div class="reco-item"></div>
        <div class="reco-item"></div>
        <div class="reco-item"></div>
        <div class="reco-item"></div>
        <div class="sidebar-footer">
          <div class="arrow-down"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Script Émulateur Nostalgia -->
  <script src="https://unpkg.com/nostalgia.js/dist/nostalgia.js"></script>
  <script>
    // 1. Initialisation de l'émulateur
    const ROM_URL = 'https://raw.githubusercontent.com/ton-compte/ton-depot/main/roms/mario.nes';

    const emulator = new Nostalgia({
      element: '#emulator-viewport',
      core: 'nes',
      controls: true,
      stateButtons: true
    });

    emulator.loadURL(ROM_URL);

    // 2. Gestion dynamique du bouton Favoris
    const favButton = document.getElementById('favButton');
    const favText = document.getElementById('favText');
    let isFavorite = false;

    favButton.addEventListener('click', () => {
      isFavorite = !isFavorite;
      favButton.classList.toggle('active', isFavorite);
      favText.textContent = isFavorite ? 'Favori' : 'Ajouter aux favoris';
    });

    // 3. Gestion dynamique des étoiles de notation
    const stars = document.querySelectorAll('.star');
    let currentRating = 4; // Note par défaut (4/5)

    function updateStars(rating) {
      stars.forEach(star => {
        const val = parseInt(star.getAttribute('data-value'));
        if (val <= rating) {
          star.classList.add('active');
        } else {
          star.classList.remove('active');
        }
      });
    }

    // Appliquer la note par défaut
    updateStars(currentRating);

    stars.forEach(star => {
      // Effet au survol
      star.addEventListener('mouseover', () => {
        const hoverValue = parseInt(star.getAttribute('data-value'));
        stars.forEach(s => {
          const val = parseInt(s.getAttribute('data-value'));
          if (val <= hoverValue) {
            s.classList.add('hover');
          } else {
            s.classList.remove('hover');
          }
        });
      });

      // Retrait du survol
      star.addEventListener('mouseout', () => {
        stars.forEach(s => s.classList.remove('hover'));
      });

      // Enregistrement au clic
      star.addEventListener('click', () => {
        currentRating = parseInt(star.getAttribute('data-value'));
        updateStars(currentRating);
      });
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Nin-tage</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #1a1a1a;
      color: #ffffff;
      display: flex;
      justify-content: center;
      padding: 20px;
    }

    #app-container {
      width: 820px;
      border: 2px solid #000;
      background-color: #2b2b2b;
      box-shadow: 0 0 15px rgba(0,0,0,0.8);
    }

    /* --- TOP HEADER --- */
    #top-bar {
      display: flex;
      background: linear-gradient(to bottom, #ffff00 0%, #cccc00 100%);
      border-bottom: 2px solid #000;
      height: 70px;
    }

    .logo-zone {
      width: 280px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-right: 2px solid #000;
      background: linear-gradient(to bottom, #ffff00 0%, #d4d400 100%);
      cursor: pointer;
      user-select: none;
    }

    .logo-badge {
      background: linear-gradient(to bottom, #e60000 0%, #990000 100%);
      border: 3px solid #000;
      border-radius: 20px;
      padding: 5px 25px;
      color: #e60000;
      font-weight: bold;
      font-size: 22px;
      text-shadow: 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
    }

    .header-nav {
      display: flex;
      flex: 1;
    }

    .nav-btn {
      flex: 1;
      border-right: 2px solid #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #000;
      cursor: pointer;
      background: linear-gradient(to bottom, #d8e000 0%, #a0a800 100%);
    }

    .user-zone {
      width: 230px;
      background: linear-gradient(to bottom, #cccccc 0%, #888888 100%);
      border-left: 2px solid #000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
    }

    .login-btn {
      background: linear-gradient(to bottom, #ffffff 0%, #cccccc 100%);
      border: 2px solid #000;
      border-radius: 6px;
      padding: 8px 16px;
      color: #000;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      box-shadow: inset 0 1px 0 #fff, 0 2px 3px rgba(0,0,0,0.3);
    }

    /* --- ONGLETS --- */
    #tab-bar {
      display: flex;
      background-color: #1c1c1c;
      border-bottom: 2px solid #000;
    }

    .tab {
      padding: 10px 20px;
      color: #ccc;
      font-weight: bold;
      font-size: 13px;
      border-right: 1px solid #333;
      cursor: pointer;
      background: linear-gradient(to bottom, #3a3a3a 0%, #222222 100%);
    }

    .tab.active {
      background: linear-gradient(to bottom, #444444 0%, #1a1a1a 100%);
      color: #fff;
      border-top: 3px solid #ff9900;
      border-bottom: 1px solid #1a1a1a;
      border-radius: 8px 8px 0 0;
      margin-top: -3px;
    }

    /* --- LAYOUT PRINCIPAL --- */
    #main-content {
      display: flex;
    }

    #game-area {
      flex: 1;
      padding: 15px;
      background-color: #222222;
      border-right: 2px solid #000;
    }

    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 10px;
    }

    .game-title-block h1 {
      color: #ff9900;
      font-size: 20px;
      text-decoration: underline;
    }

    .game-title-block p {
      color: #aaa;
      font-size: 12px;
      margin-top: 2px;
    }

    .tags-container {
      display: flex;
      gap: 6px;
    }

    .tag {
      padding: 3px 10px;
      border-radius: 6px;
      border: 2px solid #000;
      font-weight: bold;
      font-size: 11px;
      color: #fff;
    }

    .tag-green { background: linear-gradient(to bottom, #00cc44 0%, #006622 100%); }
    .tag-darkgreen { background: linear-gradient(to bottom, #008833 0%, #004411 100%); }
    .tag-red { background: linear-gradient(to bottom, #cc0000 0%, #660000 100%); }

    /* --- ÉMULATEUR ET CANVAS --- */
    #emulator-viewport {
      width: 100%;
      height: 380px;
      background-color: #000;
      border: 2px solid #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    canvas#nes-canvas {
      width: 506px;
      height: 380px;
      image-rendering: pixelated;
      background: #000;
    }

    /* Commandes Émulateur */
    .emu-controls {
      position: absolute;
      top: 10px;
      right: 10px;
      display: flex;
      gap: 5px;
      z-index: 10;
    }

    .emu-btn {
      background: #333;
      color: #fff;
      border: 1px solid #777;
      padding: 4px 8px;
      font-size: 11px;
      cursor: pointer;
      border-radius: 3px;
    }

    .emu-btn:hover { background: #555; }

    #status-msg {
      color: #ffcc00;
      font-size: 14px;
      position: absolute;
    }

    /* --- FOOTER & SIDEBAR --- */
    .game-footer {
      margin-top: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(to bottom, #3a3a3a 0%, #151515 100%);
      border: 1px solid #555;
      padding: 6px 12px;
      border-radius: 4px;
    }

    .fav-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #fff;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      user-select: none;
      padding: 4px 8px;
    }

    .fav-btn.active .fav-icon { color: #ff3333; }

    .stars { display: flex; gap: 2px; cursor: pointer; }
    .star { font-size: 20px; color: #444; }
    .star.active, .star.hover { color: #ffcc00; }

    #sidebar { width: 210px; background-color: #2b2b2b; }
    .sidebar-header {
      background: linear-gradient(to bottom, #444 0%, #111 100%);
      color: #fff;
      text-align: center;
      padding: 8px;
      font-size: 13px;
      font-weight: bold;
      border-bottom: 1px solid #000;
    }
    .reco-item {
      height: 45px;
      border-bottom: 2px solid #000;
      background: linear-gradient(to bottom, #666666 0%, #333333 100%);
    }
  </style>
</head>
<body>

  <div id="app-container">
    <div id="top-bar">
      <div class="logo-zone" onclick="window.location.reload();">
        <div class="logo-badge">Nin-tage</div>
      </div>
      <div class="header-nav">
        <div class="nav-btn">NES</div>
        <div class="nav-btn">Game Boy</div>
      </div>
      <div class="user-zone">
        <button class="login-btn">Connectez-vous</button>
      </div>
    </div>

    <div id="tab-bar">
      <div class="tab">Histoire / Manuel</div>
      <div class="tab active">Jouer à ce jeu</div>
      <div class="tab">Commentaires / Forum</div>
    </div>

    <div id="main-content">
      <div id="game-area">
        <div class="game-header">
          <div class="game-title-block">
            <h1>Mega Man II</h1>
            <p>1990 – Capcom</p>
          </div>
          <div class="tags-container">
            <span class="tag tag-green">Plateformer</span>
            <span class="tag tag-darkgreen">Classique</span>
            <span class="tag tag-red">Difficile</span>
          </div>
        </div>

        <!-- ZONE ÉMULATEUR NES -->
        <div id="emulator-viewport">
          <div class="emu-controls">
            <button class="emu-btn" onclick="toggleFullscreen()">Plein écran</button>
          </div>
          <span id="status-msg">Chargement du jeu...</span>
          <canvas id="nes-canvas" width="256" height="240"></canvas>
        </div>

        <div class="game-footer">
          <div class="fav-btn" id="favButton">
            <span class="fav-icon" id="favIcon">♥</span>
            <span id="favText">Ajouter aux favoris</span>
          </div>
          <div class="stars" id="starRating">
            <span class="star" data-value="1">★</span>
            <span class="star" data-value="2">★</span>
            <span class="star" data-value="3">★</span>
            <span class="star" data-value="4">★</span>
            <span class="star" data-value="5">★</span>
          </div>
        </div>
      </div>

      <div id="sidebar">
        <div class="sidebar-header">Recommandations</div>
        <div class="reco-item"></div>
        <div class="reco-item"></div>
        <div class="reco-item"></div>
        <div class="reco-item"></div>
        <div class="reco-item"></div>
      </div>
    </div>
  </div>

  <!-- Librairie Émulateur jsNES -->
  <script src="https://unpkg.com/jsnes/dist/jsnes.min.js"></script>
  <script>
    // --- 1. MOTEUR ÉMULATEUR NES ---
    const canvas = document.getElementById('nes-canvas');
    const ctx = canvas.getContext('2d');
    const statusMsg = document.getElementById('status-msg');
    const imageData = ctx.createImageData(256, 240);
    const buf = new ArrayBuffer(imageData.data.length);
    const buf8 = new Uint8ClampedArray(buf);
    const buf32 = new Uint32Array(buf);

    const nes = new jsnes.NES({
      onFrame: function(frameBuffer) {
        for (let i = 0; i < frameBuffer.length; i++) {
          buf32[i] = 0xFF000000 | frameBuffer[i];
        }
        imageData.data.set(buf8);
        ctx.putImageData(imageData, 0, 0);
      },
      onAudioSample: function() {} // Audio désactivé pour la stabilité basique
    });

    // Chargement de la ROM depuis le dossier
    fetch('./roms/test.nes')
      .then(response => {
        if (!response.ok) throw new Error("ROM introuvable !");
        return response.arrayBuffer();
      })
      .then(buffer => {
        const bytes = new Uint8Array(buffer);
        let binary = '';
        for (let i = 0; i < bytes.byteLength; i++) {
          binary += String.fromCharCode(bytes[i]);
        }
        nes.loadROM(binary);
        statusMsg.style.display = 'none';
        
        // Boucle de jeu ~60 FPS
        function step() {
          nes.frame();
          requestAnimationFrame(step);
        }
        requestAnimationFrame(step);
      })
      .catch(err => {
        statusMsg.textContent = "Erreur : Vérifiez que 'mario.nes' est bien dans le dossier 'roms'";
        statusMsg.style.color = "#ff3333";
      });

    // CONTROLES DU JOUEUR (Flèches = Déplacement, X = A, Z = B, Entrée = Start, Maj = Select)
    const keyboardMap = {
      38: jsnes.Controller.BUTTON_UP,
      40: jsnes.Controller.BUTTON_DOWN,
      37: jsnes.Controller.BUTTON_LEFT,
      39: jsnes.Controller.BUTTON_RIGHT,
      88: jsnes.Controller.BUTTON_A,      // Touche X
      90: jsnes.Controller.BUTTON_B,      // Touche Z
      13: jsnes.Controller.BUTTON_START,  // Entrée
      16: jsnes.Controller.BUTTON_SELECT  // Majuscule
    };

    window.addEventListener('keydown', (e) => {
      if (keyboardMap[e.keyCode] !== undefined) {
        nes.buttonDown(1, keyboardMap[e.keyCode]);
        e.preventDefault();
      }
    });

    window.addEventListener('keyup', (e) => {
      if (keyboardMap[e.keyCode] !== undefined) {
        nes.buttonUp(1, keyboardMap[e.keyCode]);
        e.preventDefault();
      }
    });

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        canvas.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    }

    // --- 2. FAVORIS & ÉTOILES ---
    const favButton = document.getElementById('favButton');
    const favText = document.getElementById('favText');
    let isFavorite = false;
    favButton.addEventListener('click', () => {
      isFavorite = !isFavorite;
      favButton.classList.toggle('active', isFavorite);
      favText.textContent = isFavorite ? 'Favori' : 'Ajouter aux favoris';
    });

    const stars = document.querySelectorAll('.star');
    let currentRating = 4;
    function updateStars(rating) {
      stars.forEach(star => {
        const val = parseInt(star.getAttribute('data-value'));
        star.classList.toggle('active', val <= rating);
      });
    }
    updateStars(currentRating);
    stars.forEach(star => {
      star.addEventListener('click', () => {
        currentRating = parseInt(star.getAttribute('data-value'));
        updateStars(currentRating);
      });
    });
  </script>
</body>
</html>

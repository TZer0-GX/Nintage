<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Gaming Hub</title>
    <!-- Inscription de la librairie JSNES pour l'émulation NES -->
    <script src="https://unpkg.com/jsnes/dist/jsnes.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* En-tête */
        header {
            background-color: #2a2a2a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            border-bottom: 3px solid #000;
        }

        .header-logo {
            background-color: #ffffff;
            color: #000000;
            padding: 10px 20px;
            font-weight: bold;
            font-size: 1.1rem;
            border: 2px solid #000;
        }

        .header-status {
            background-color: #a6e22e;
            color: #000000;
            padding: 10px 25px;
            font-weight: bold;
            font-size: 1.1rem;
            border: 2px solid #000;
        }

        /* Conteneur principal */
        main {
            display: flex;
            justify-content: center;
            padding: 30px 20px;
            flex-grow: 1;
        }

        .emulator-container {
            width: 100%;
            max-width: 800px;
            background-color: #2b2b2b;
            padding: 20px;
            border: 3px solid #000;
        }

        .game-header {
            margin-bottom: 15px;
        }

        .game-title {
            color: #ffff00;
            font-size: 2.2rem;
            font-weight: bold;
            text-decoration: underline;
            margin-bottom: 5px;
        }

        .game-meta {
            color: #ff7700;
            font-size: 1.2rem;
            font-weight: bold;
        }

        /* Cadre de l'émulateur */
        .screen-box {
            background-color: #ffffff;
            border: 4px solid #000;
            width: 100%;
            aspect-ratio: 4 / 3;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        canvas {
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }

        .rom-selector {
            position: absolute;
            background: rgba(0,0,0,0.85);
            color: #fff;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .rom-selector input[type="file"] {
            display: none;
        }

        .btn-upload {
            background-color: #ff7700;
            color: #fff;
            padding: 10px 20px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            display: inline-block;
            border-radius: 4px;
        }

        .btn-upload:hover {
            background-color: #ff9933;
        }

        /* Barre d'actions sous le jeu */
        .actions-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #000000;
            padding: 10px 15px;
            border: 3px solid #000;
            margin-top: -3px;
        }

        .favorite-btn {
            background-color: #888888;
            color: #000;
            border: 2px solid #000;
            padding: 8px 15px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .favorite-btn.active {
            background-color: #ff4d4d;
            color: #fff;
        }

        .heart-icon {
            color: #ff0000;
            font-size: 1.3rem;
        }

        .stars-container {
            display: flex;
            gap: 5px;
            cursor: pointer;
        }

        .star {
            font-size: 2rem;
            color: #555;
            transition: color 0.2s;
            user-select: none;
        }

        .star.selected, .star.hover {
            color: #ffcc00;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-logo">Hello world :)</div>
        <div class="header-status">Coming soon...</div>
    </header>

    <main>
        <div class="emulator-container">
            <div class="game-header">
                <h1 class="game-title" id="display-title">Titre du jeu</h1>
                <p class="game-meta" id="display-meta">Année - Éditeur</p>
            </div>

            <div class="screen-box">
                <canvas id="nes-canvas" width="256" height="240"></canvas>
                <div class="rom-selector" id="rom-overlay">
                    <p>Chargement de la ROM en cours...</p>
                    <label class="btn-upload">
                        Choisir une ROM (.nes) manuellement
                        <input type="file" id="rom-file-input" accept=".nes">
                    </label>
                </div>
            </div>

            <div class="actions-bar">
                <button class="favorite-btn" id="fav-btn">
                    <span class="heart-icon">❤️+</span>
                    <span>Favoris</span>
                </button>

                <div class="stars-container" id="stars-box">
                    <span class="star" data-value="1">★</span>
                    <span class="star" data-value="2">★</span>
                    <span class="star" data-value="3">★</span>
                    <span class="star" data-value="4">★</span>
                    <span class="star" data-value="5">★</span>
                </div>
            </div>
        </div>
    </main>

    <script>
        // =========================================================
        // CONFIGURATION DU JEU (Modifiez ces variables pour changer le jeu)
        // =========================================================
        const JEU_CONFIG = {
            titre: "Mega Man II",
            annee: "1990",
            editeur: "Capcom",
            // Indiquez le chemin vers votre fichier .nes stocké dans le projet GitHub
            cheminROM: "roms/test.nes" 
        };

        // 1. Mise à jour de l'affichage du titre et des métadonnées
        document.getElementById('display-title').textContent = `"${JEU_CONFIG.titre}"`;
        document.getElementById('display-meta').textContent = `"${JEU_CONFIG.annee} - ${JEU_CONFIG.editeur}"`;
        document.title = `${JEU_CONFIG.titre} - NES Online`;

        // 2. Gestionnaire d'émulation JSNES
        const canvas = document.getElementById('nes-canvas');
        const ctx = canvas.getContext('2d');
        const imageData = ctx.createImageData(256, 240);
        const buf = new ArrayBuffer(imageData.data.length);
        const buf8 = new Uint8ClampedArray(buf);
        const buf32 = new Uint32Array(buf);

        const nes = new jsnes.NES({
            onFrame: function(frameBuffer) {
                for (let i = 0; i < frameBuffer.length; i++) {
                    buf32[i] = 0xFF000000 | frameBuffer[i];
                }
                imageData.data.set(buf8);
                ctx.putImageData(imageData, 0, 0);
            }
        });

        function loadRomArrayBuffer(buffer) {
            const bytes = new Uint8Array(buffer);
            let binary = "";
            for (let i = 0; i < bytes.byteLength; i++) {
                binary += String.fromCharCode(bytes[i]);
            }
            nes.loadROM(binary);
            document.getElementById('rom-overlay').style.display = 'none';
            
            // Boucle de rendu
            setInterval(() => {
                nes.frame();
            }, 1000 / 60);
        }

        // Chargement automatique de la ROM configurée
        if (JEU_CONFIG.cheminROM) {
            fetch(JEU_CONFIG.cheminROM)
                .then(response => {
                    if (!response.ok) throw new Error("ROM introuvable à l'adresse indiquée.");
                    return response.arrayBuffer();
                })
                .then(buffer => loadRomArrayBuffer(buffer))
                .catch(err => {
                    console.log("Chargement automatique échoué. Utilisez le bouton manuel :", err);
                    document.querySelector('#rom-overlay p').textContent = "ROM non trouvée. Veuillez charger un fichier .nes :";
                });
        }

        // Sélecteur manuel de ROM de secours
        document.getElementById('rom-file-input').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => loadRomArrayBuffer(event.target.result);
                reader.readAsArrayBuffer(file);
            }
        });

        // Controles au clavier (Flèches + Z / X + Entrée / Espace)
        const KEY_MAP = {
            37: jsnes.Controller.BUTTON_LEFT,
            39: jsnes.Controller.BUTTON_RIGHT,
            38: jsnes.Controller.BUTTON_UP,
            40: jsnes.Controller.BUTTON_DOWN,
            90: jsnes.Controller.BUTTON_A,      // Z
            88: jsnes.Controller.BUTTON_B,      // X
            13: jsnes.Controller.BUTTON_START,  // Entrée
            32: jsnes.Controller.BUTTON_SELECT  // Espace
        };

        window.addEventListener('keydown', (e) => {
            if (KEY_MAP[e.keyCode] !== undefined) {
                nes.buttonDown(1, KEY_MAP[e.keyCode]);
                e.preventDefault();
            }
        });

        window.addEventListener('keyup', (e) => {
            if (KEY_MAP[e.keyCode] !== undefined) {
                nes.buttonUp(1, KEY_MAP[e.keyCode]);
                e.preventDefault();
            }
        });

        // 3. Interactions Favoris et Étoiles
        const favBtn = document.getElementById('fav-btn');
        const stars = document.querySelectorAll('.star');
        const gameId = JEU_CONFIG.titre.replace(/\s+/g, '_').toLowerCase();

        // Charger l'état sauvegardé
        let isFav = localStorage.getItem(`fav_${gameId}`) === 'true';
        let currentRating = parseInt(localStorage.getItem(`rating_${gameId}`)) || 0;

        function updateFavUI() {
            if (isFav) favBtn.classList.add('active');
            else favBtn.classList.remove('active');
        }

        function updateStarsUI(rating) {
            stars.forEach(star => {
                const val = parseInt(star.getAttribute('data-value'));
                if (val <= rating) star.classList.add('selected');
                else star.classList.remove('selected');
            });
        }

        updateFavUI();
        updateStarsUI(currentRating);

        favBtn.addEventListener('click', () => {
            isFav = !isFav;
            localStorage.setItem(`fav_${gameId}`, isFav);
            updateFavUI();
        });

        stars.forEach(star => {
            star.addEventListener('click', () => {
                currentRating = parseInt(star.getAttribute('data-value'));
                localStorage.setItem(`rating_${gameId}`, currentRating);
                updateStarsUI(currentRating);
            });
        });
    </script>
</body>
</html>
